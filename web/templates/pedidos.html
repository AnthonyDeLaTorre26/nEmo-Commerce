<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - nEmo Commerce</title>
</head>

<body>

    <h1>nEmo Commerce</h1>

    <nav>
        <a href="/">Inicio</a> |
        <a href="/productos">Productos</a> |
        <a href="/clientes">Clientes</a> |
        <a href="/pedidos">Pedidos</a>
    </nav>

    <hr>

    <h2>Realizar pedido</h2>

    <form action="/pedidos/agregar" method="POST">

        <label>Cliente:</label>
        <select name="cliente_id" required>

            <option value="">Seleccione un cliente</option>

            {{range .Clientes}}
            <option value="{{.ID}}">
                {{.Nombre}} - {{.Correo}}
            </option>
            {{end}}

        </select>

        <br><br>

        <label>Producto:</label>
        <select name="producto_id" required>

            <option value="">Seleccione un producto</option>

            {{range .Productos}}
            <option value="{{.ID}}">
                {{.Codigo}} - {{.Nombre}} - ${{printf "%.2f" .Precio}} (Stock: {{.Stock}})
            </option>
            {{end}}

        </select>

        <br><br>

        <label>Cantidad:</label>
        <input type="number" name="cantidad" min="1" required>

        <br><br>

        <button type="submit">Realizar pedido</button>

    </form>

    <hr>

    <h2>Pedidos registrados</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Total</th>
        </tr>

        {{range .Pedidos}}

        <tr>
            <td>{{.ID}}</td>
            <td>{{.Cliente}}</td>
            <td>{{.Producto}}</td>
            <td>{{.Cantidad}}</td>
            <td>${{printf "%.2f" .Precio}}</td>
            <td>${{printf "%.2f" .Total}}</td>
        </tr>

        {{end}}

    </table>

</body>
</html>
